name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage gate (93%)
        run: >
          pytest tests/
          --cov=app
          --cov=operations
          --cov=cli
          --cov=connectors
          --cov-report=term-missing
          --cov-fail-under=93

      - name: Check JS syntax of frontend modules
        run: |
          node --check static/js/app.js
          node --check static/js/state.js
          node --check static/js/grid.js
          node --check static/js/api.js
          node --check static/js/modals.js

  # Smoke real del conector Postgres: el driver hablando con un servidor de
  # verdad (DDL derivado de los dtypes, nulos reales, rollback). Los tests
  # unitarios usan un driver falso; esto es lo que los complementa y lo que
  # pilló el bug del boolean con nulos. El test se salta sin CATFLIP_PG_SMOKE.
  pg-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catflip
          POSTGRES_PASSWORD: smoke_pg_2026
          POSTGRES_DB: catflip_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catflip -d catflip_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CATFLIP_PG_SMOKE: "1"
      CATFLIP_PG_HOST: 127.0.0.1
      CATFLIP_PG_PORT: "5432"
      CATFLIP_PG_DB: catflip_smoke
      CATFLIP_PG_USER: catflip
      CATFLIP_PG_PASSWORD: smoke_pg_2026
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-connectors.txt

      - name: Install dependencies (con el driver psycopg)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-connectors.txt

      - name: Smoke real del conector Postgres
        run: pytest tests/test_connectors_postgres_live.py -v

  # Smoke real del conector S3: boto3 contra un endpoint S3 de verdad.
  # LocalStack porque MinIO dejó de distribuirse en 2026 (el `latest`
  # exige LOCALSTACK_AUTH_TOKEN, por eso va pineado). El test se salta sin
  # CATFLIP_S3_SMOKE.
  s3-smoke:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.13.1
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      CATFLIP_S3_SMOKE: "1"
      CATFLIP_S3_ENDPOINT: http://127.0.0.1:4566
      CATFLIP_S3_REGION: us-east-1
      CATFLIP_S3_BUCKET: catflip-smoke
      CATFLIP_S3_ACCESS_KEY: test
      CATFLIP_S3_SECRET_KEY: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-connectors.txt

      - name: Install dependencies (con el driver boto3)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-connectors.txt

      - name: Smoke real del conector S3
        run: pytest tests/test_connectors_s3_live.py -v

  axe:
    runs-on: ubuntu-latest
    # Licencia premium para que el gate cubra también las 2 paletas
    # premium (Aurora y Solar) → 15 corridas en total
    env:
      CATFLIP_PREMIUM_KEY: ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start app
        run: |
          python app.py > /tmp/catflip.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5050/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5050/ > /dev/null

      - name: Run axe (WCAG 2.0 A/AA) en claro y oscuro
        run: npm run test:axe

      - name: Subir violations.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-violations
          path: violations.json
          if-no-files-found: ignore

  # Los workflows solo se validaban ejecutándolos de verdad: actionlint
  # revisa sintaxis YAML, expressions y —con shellcheck en PATH— el shell
  # de cada `run:` (p. ej. variables declaradas sin usar). Si faltara
  # shellcheck esos checks se saltarían en silencio, por eso ambos
  # binarios se instalan aquí fijados con checksum en lugar de fiarse de
  # la imagen del runner. El mismo shellcheck pasa además por los scripts
  # del repo (`scripts/*.sh`), que solo se ejecutaban a mano en local.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instala actionlint 1.7.12 (con checksum)
        run: |
          curl -sSfL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo install -m 755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Instala shellcheck 0.11.0 (con checksum)
        # Fijado como actionlint: la imagen del runner trae una versión
        # que cambia con el tiempo (0.11.0 añadió SC2329, ausente en el
        # 0.10.0 que había en local) y el mismo fichero debe pasar en
        # local y en la CI. /usr/local/bin va antes que /usr/bin en PATH,
        # así que pisa el shellcheck de la imagen.
        run: |
          curl -sSfL -o /tmp/shellcheck.tgz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  /tmp/shellcheck.tgz" | sha256sum -c -
          tar -xzf /tmp/shellcheck.tgz -C /tmp shellcheck-v0.11.0/shellcheck
          sudo install -m 755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version | sed -n '2p'

      - name: Valida los workflows (actionlint + shellcheck)
        run: |
          if ! command -v shellcheck > /dev/null; then
            echo "::error::shellcheck no está en PATH: los checks de shell se saltarían en silencio"
            exit 1
          fi
          actionlint -no-color

      - name: Shellcheck de los scripts del repo
        # shellcheck ya se comprobó en el paso anterior (si faltara, el job
        # se habría cortado ahí); severity por defecto = style, la máxima.
        # La versión está fijada arriba; se imprime de todas formas como
        # constancia en el log.
        run: |
          shellcheck --version | sed -n '2p'
          shellcheck scripts/*.sh

  # El `.exe` de Windows era el único artefacto que nadie probaba: se compilaba
  # a mano y el primer arranque lo hacía el usuario. Este job lo construye en
  # el runner oficial (sin firma: la clave GPG es de publicación) y comprueba
  # lo que un venv no puede comprobar — que el paquete incluya `formats.py`,
  # `python_calamine`, las plantillas y los fixtures de lectura reales.
  windows-exe:
    runs-on: windows-latest
    # Git Bash: el arranque en segundo plano del .exe y curl.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build the unsigned .exe
        # PyInstaller onefile: tarda unos minutos (pandas + pyarrow).
        run: SKIP_SIGN=1 packaging/windows/build.sh

      - name: Smoke — el .exe arranca y lee los fixtures
        # Mismo script que usan los bundles de Linux y el release: una sola
        # copia del arranque, la espera, el smoke y la limpieza (incluido el
        # `taskkill` del hijo que deja el onefile). Sin `/version/check`: su
        # backoff contra api.github.com no cabe en cada PR, y el tag lo hace.
        run: scripts/smoke_package.sh windows --sin-version-check

  # ¿El diff toca algo que acabe DENTRO del bundle? Lo decide
  # `scripts/toca_bundle.sh` con el propio git (sin acciones de terceros) y
  # de forma conservadora: solo dice «no» si todo lo cambiado es
  # documentación, tests o metadatos. Ante la duda responde «sí», así que un
  # fallo del filtro construye de más, nunca de menos.
  cambios:
    name: ¿Afecta al bundle?
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.filtro.outputs.bundle }}
    steps:
      - uses: actions/checkout@v7
        with:
          # El diff necesita la base en el clon: con el fetch superficial por
          # defecto solo hay un commit y todo saldría «sí».
          fetch-depth: 0

      - id: filtro
        env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="$BASE_PR"
          else
            BASE="$BASE_PUSH"
          fi
          # Si el filtro se rompe, el paso NO debe caer: un paso que falla
          # deja `linux-bundles` en «skipped» (needs incompleto) y el PR
          # perdería la cobertura en silencio. Se construye.
          if ! DECISION="$(scripts/toca_bundle.sh "$BASE" "$GITHUB_SHA")"; then
            echo "::warning::El filtro falló; se construye el bundle"
            DECISION=true
          fi
          echo "base=$BASE head=$GITHUB_SHA → bundle=$DECISION"
          echo "bundle=$DECISION" >> "$GITHUB_OUTPUT"

  # Los paquetes de Linux solo se construían y probaban en el tag
  # (packaging.yml): una regresión de empaquetado —`formats.py` sin
  # hiddenimport, `python_calamine` fuera, plantillas viejas— pasaba `main` y
  # estallaba al publicar. Este job les pasa el MISMO smoke que el release,
  # `scripts/smoke_package.sh`, en cada PR.
  #
  # Coste: un único runner para los dos formatos y el binario congelado se
  # construye una vez (el Flatpak reutiliza `dist/CatFlip` con SKIP_FROZEN=1),
  # así que no se paga PyInstaller dos veces. Además se salta entero cuando el
  # PR no toca nada del bundle (~5 min que no se pagan en un PR de docs). Nada
  # se firma aquí (la clave GPG es de publicación): el AppImage va con
  # `SKIP_SIGN=1` y el Flatpak sin su firma interna, que se instala igual.
  # `/version/check` se omite (`--sin-version-check`): su backoff contra el
  # rate limit de api.github.com llega a 305 s por intento y en PRs solo aporta
  # intermitencia; el tag lo sigue comprobando.
  linux-bundles:
    name: AppImage y Flatpak (sin firmar)
    needs: [cambios]
    if: needs.cambios.outputs.bundle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CATFLIP_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Herramientas del build
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils

      - name: AppImage — construye (sin firmar) y smoke
        run: |
          SKIP_SIGN=1 packaging/appimage/build.sh
          scripts/smoke_package.sh appimage --sin-version-check

      - name: flatpak-builder + runtime 26.08
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Flatpak — construye (sin firmar) y smoke
        env:
          # flatpak-builder del host: sin el sandbox de org.flatpak.Builder no
          # existe el problema de resolver el SDK en la instalación de sistema.
          FLATPAK_BUILDER_CMD: flatpak-builder
        run: |
          SKIP_FROZEN=1 SKIP_SIGN=1 packaging/flatpak/build.sh
          scripts/smoke_package.sh flatpak --sin-version-check
