name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage gate (93%)
        run: >
          pytest tests/
          --cov=app
          --cov=operations
          --cov=cli
          --cov-report=term-missing
          --cov-fail-under=93

      - name: Check JS syntax of frontend modules
        run: |
          node --check static/js/app.js
          node --check static/js/state.js
          node --check static/js/grid.js
          node --check static/js/api.js
          node --check static/js/modals.js

  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start app
        run: |
          python app.py > /tmp/catflip.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5050/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5050/ > /dev/null

      - name: Run axe (WCAG 2.0 A/AA) en claro y oscuro
        run: npm run test:axe

      - name: Subir violations.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-violations
          path: violations.json
          if-no-files-found: ignore
