name: packaging

# Construye y firma los paquetes del core MIT en cada tag v* (y bajo demanda
# con workflow_dispatch). Los artefactos firmados suben como artifacts; en un
# tag además se adjuntan a la release. La clave privada vive SOLO como secreto
# del repo (GPG_SIGNING_KEY, armored) y su huella está versionada en
# packaging/gpg/FINGERPRINT: si no coinciden, el paso de firma falla.
#
# ORDEN DE CADA JOB: construir (SKIP_SIGN=1 donde se puede) → scripts/
# smoke_package.sh sobre el artefacto REAL → packaging/sign.sh → verificar.
# Antes se firmaba y se verificaban las firmas antes de ejecutar el bundle:
# los .asc eran válidos y el paquete podía no arrancar ni leer un archivo.
# La única firma que no se puede diferir es la del repo ostree dentro del
# .flatpak, porque `flatpak install` la exige (ver packaging/flatpak/build.sh).
#
# Nota de compatibilidad: el binario se enlaza contra el glibc del runner
# (ubuntu-latest). Bajar el suelo de glibc (p. ej. Ubuntu 22.04) exigiría
# construir en un contenedor antiguo; ver packaging/README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage firmado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Herramientas del build
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils

      - name: Construye el AppImage (sin firmar)
        run: SKIP_SIGN=1 packaging/appimage/build.sh

      # Mismo smoke que Flatpak y .exe, y ANTES de firmar: arranca el
      # AppImage, lee los fixtures reales y consulta /version/check.
      - name: Smoke — arranca, lee los fixtures y consulta GitHub
        run: scripts/smoke_package.sh appimage

      - name: Importa la clave de firma
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::Falta el secreto GPG_SIGNING_KEY (clave privada armored de packaging/gpg/FINGERPRINT)"
            exit 1
          fi
          echo "$GPG_SIGNING_KEY" | gpg --batch --import

      - name: Firma el AppImage (detached + SHA256SUMS)
        run: packaging/sign.sh dist/appimage/*.AppImage

      - name: Verifica firmas y checksums
        run: packaging/sign.sh --verificar dist/appimage/*.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/appimage/
          if-no-files-found: error

  flatpak:
    name: Flatpak firmado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # La clave entra ANTES del build solo aquí: el repo ostree que va
      # dentro del .flatpak se firma al exportarlo y `flatpak install` la
      # exige, así que un bundle sin esa firma no se podría ni instalar en el
      # smoke. La firma detached (.asc) y los SHA256SUMS, que es lo que el
      # usuario verifica, sí se generan después del smoke como en los otros.
      - name: Importa la clave de firma
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::Falta el secreto GPG_SIGNING_KEY (clave privada armored de packaging/gpg/FINGERPRINT)"
            exit 1
          fi
          echo "$GPG_SIGNING_KEY" | gpg --batch --import

      - name: flatpak-builder + runtime 26.08
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Construye el Flatpak (repo ostree firmado, detached pendiente)
        env:
          # flatpak-builder del host: sin sandbox de org.flatpak.Builder no
          # existe el problema de resolver el SDK en la instalación de sistema.
          FLATPAK_BUILDER_CMD: flatpak-builder
        run: packaging/flatpak/build.sh

      # El mismo smoke que AppImage y .exe, pero por el camino del usuario
      # final: `flatpak install` del bundle y `flatpak run`, que es lo único
      # que demuestra que el sandbox sirve HTTP y sale a la red.
      - name: Smoke — instala, arranca, lee los fixtures y consulta GitHub
        run: scripts/smoke_package.sh flatpak

      - name: Firma el bundle (detached + SHA256SUMS)
        run: packaging/sign.sh dist/flatpak/*.flatpak

      - name: Verifica firmas y checksums
        run: packaging/sign.sh --verificar dist/flatpak/*.flatpak

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/flatpak/
          if-no-files-found: error

  windows:
    name: .exe firmado (Windows)
    runs-on: windows-latest
    # gpg y sha256sum NO están en el PATH de PowerShell: existen en Git
    # Bash (Git for Windows /usr/bin). Todo el job corre en bash y el
    # primer paso comprueba los dos binarios antes de gastar minutos.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Comprueba gpg y sha256sum (Git Bash)
        run: |
          command -v gpg || {
            echo "::error::Sin gpg en el runner; usa Git Bash o instala GnuPG (choco install gnupg)"
            exit 1
          }
          gpg --version | head -2
          command -v sha256sum

      - name: Construye el .exe (sin firmar)
        run: SKIP_SIGN=1 packaging/windows/build.sh

      - name: Smoke — arranca, lee los fixtures y consulta GitHub
        run: scripts/smoke_package.sh windows

      - name: Importa la clave de firma
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::Falta el secreto GPG_SIGNING_KEY (clave privada armored de packaging/gpg/FINGERPRINT)"
            exit 1
          fi
          echo "$GPG_SIGNING_KEY" | gpg --batch --import

      - name: Firma el .exe (detached + SHA256SUMS)
        run: packaging/sign.sh dist/windows/*.exe

      - name: Verifica firmas y checksums
        run: packaging/sign.sh --verificar dist/windows/*.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/windows/
          if-no-files-found: error

  release:
    name: Adjunta los paquetes a la release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [appimage, flatpak, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Crea la release (si no existe) y sube los artefactos
        env:
          GH_TOKEN: ${{ github.token }}
          # Sin checkout en este job: GH_REPO evita que gh resuelva el repo
          # con git (fallaría con «not a git repository»).
          GH_REPO: ${{ github.repository }}
        run: |
          # Cada formato trae SHA256SUMS(.asc) con el mismo nombre y los
          # assets de una release son planos: renombrarlos por formato para
          # que gh no falle con 422 "already exists".
          mv artifacts/appimage/SHA256SUMS     artifacts/appimage/SHA256SUMS.appimage
          mv artifacts/appimage/SHA256SUMS.asc artifacts/appimage/SHA256SUMS.appimage.asc
          mv artifacts/flatpak/SHA256SUMS      artifacts/flatpak/SHA256SUMS.flatpak
          mv artifacts/flatpak/SHA256SUMS.asc  artifacts/flatpak/SHA256SUMS.flatpak.asc
          mv artifacts/windows/SHA256SUMS      artifacts/windows/SHA256SUMS.windows
          mv artifacts/windows/SHA256SUMS.asc  artifacts/windows/SHA256SUMS.windows.asc
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
          # Solo ficheros y sin duplicados: artifacts/flatpak/ también trae el
          # directorio repo/ (el ostree firmado, que sí queda en el artifact del
          # run) y los assets de una release solo aceptan ficheros con nombre
          # único. `*.flatpak` ya cubre SHA256SUMS.flatpak y `*.flatpak.asc`
          # cubre SHA256SUMS.flatpak.asc: añadirlos aparte duplicaría. En
          # windows NO hay esa casualidad (SHA256SUMS.windows no acaba en
          # .exe), así que sus checksums se suben aparte: sin estas dos
          # líneas la release sale sin SHA256SUMS.windows(.asc). En appimage
          # los ficheros se listan uno a uno a propósito: con `*` también
          # entraba cualquier carpeta que dejara el smoke y gh moría al
          # intentar subirla (el squashfs-root de 1.5.1).
          gh release upload "$GITHUB_REF_NAME" --clobber \
            artifacts/appimage/*.AppImage \
            artifacts/appimage/*.AppImage.asc \
            artifacts/appimage/SHA256SUMS.appimage \
            artifacts/appimage/SHA256SUMS.appimage.asc \
            artifacts/flatpak/*.flatpak \
            artifacts/flatpak/*.flatpak.asc \
            artifacts/windows/*.exe \
            artifacts/windows/*.exe.asc \
            artifacts/windows/SHA256SUMS.windows \
            artifacts/windows/SHA256SUMS.windows.asc
