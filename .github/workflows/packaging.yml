name: packaging

# Construye y firma los paquetes del core MIT en cada tag v* (y bajo demanda
# con workflow_dispatch). Los artefactos firmados suben como artifacts; en un
# tag además se adjuntan a la release. La clave privada vive SOLO como secreto
# del repo (GPG_SIGNING_KEY, armored) y su huella está versionada en
# packaging/gpg/FINGERPRINT: si no coinciden, el paso de firma falla.
#
# ORDEN DE CADA JOB: construir (SKIP_SIGN=1 donde se puede) → scripts/
# smoke_package.sh sobre el artefacto REAL → packaging/sign.sh → verificar.
# Antes se firmaba y se verificaban las firmas antes de ejecutar el bundle:
# los .asc eran válidos y el paquete podía no arrancar ni leer un archivo.
# La única firma que no se puede diferir es la del repo ostree dentro del
# .flatpak, porque `flatpak install` la exige (ver packaging/flatpak/build.sh).
#
# Nota de compatibilidad: el binario se enlaza contra el glibc del runner
# (ubuntu-latest). Bajar el suelo de glibc (p. ej. Ubuntu 22.04) exigiría
# construir en un contenedor antiguo; ver packaging/README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    # Con `tag`, se verifica una release YA publicada sin cortar una versión:
    # es la primera prueba de fuego del job `verificar-release` y sirve para
    # reverificar una release antigua. Vacío = solo construir (lo de siempre).
    inputs:
      tag:
        description: "Tag ya publicado a verificar (p. ej. v1.6.0). Vacío = solo construir."
        required: false
        default: ""
      exigir_atestacion:
        description: >-
          Exigir atestación de build. Desactívalo solo para reverificar
          releases publicadas antes de que existieran las atestaciones (1.6.1
          y anteriores).
        type: boolean
        required: false
        default: true
  # Semanal: el camino firmado (clave GPG, flatpak-builder + runtime, los tres
  # bundles) solo se ejercitaba en un tag o con un dispatch a mano, así que una
  # clave caducada, un secreto mal rotado o un runtime que desaparece de
  # flathub se descubrían al publicar. Esta corrida hace lo mismo que un tag
  # MENOS publicar: el job `release` está atado a `refs/tags/`, y los artifacts
  # no se suben fuera de un tag (ver `if` en cada upload).
  #
  # Ojo: GitHub desactiva los workflows programados tras 60 días sin actividad
  # en el repositorio. Si el cron deja de aparecer, se reactiva en Actions.
  # Y si la corrida falla, el job `avisar-fallo` lo deja en un issue.
  schedule:
    - cron: "15 4 * * 1" # lunes 04:15 UTC

# El workflow solo LEE: los jobs que escriben (la release, la limpieza de
# borradores) declaran `contents: write` o `issues: write` para sí mismos. Un
# `contents: write` global le da permiso de escritura a builds que solo
# necesitan descargar dependencias.
permissions:
  contents: read

# Dos tags a la vez no deben pelearse por el mismo borrador ni un dispatch de
# verificación cancelar un tag en curso.
concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    name: AppImage firmado
    runs-on: ubuntu-latest
    # El workflow declara `contents: write` para la release; los jobs de build
    # solo leen y atestiguan (OIDC + attestations).
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Con `/version/check` y su backoff, una corrida sin rate limit tarda ~1,5
    # min; el tope solo evita que un cuelgue se coma la cuota del runner.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Herramientas del build
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils

      - name: Construye el AppImage (sin firmar)
        run: SKIP_SIGN=1 packaging/appimage/build.sh

      # Mismo smoke que Flatpak y .exe, y ANTES de firmar: arranca el
      # AppImage, lee los fixtures reales y consulta /version/check.
      - name: Smoke — arranca, lee los fixtures y consulta GitHub
        run: scripts/smoke_package.sh appimage

      - name: Importa la clave de firma
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::Falta el secreto GPG_SIGNING_KEY (clave privada armored de packaging/gpg/FINGERPRINT)"
            exit 1
          fi
          echo "$GPG_SIGNING_KEY" | gpg --batch --import

      - name: Firma el AppImage (detached + SHA256SUMS)
        run: packaging/sign.sh dist/appimage/*.AppImage

      - name: Verifica firmas y checksums
        run: packaging/sign.sh --verificar dist/appimage/*.AppImage

      # La firma dice «lo firmé yo»; esto dice «salió de este repo, este
      # commit y este workflow», que es lo que distingue un asset sustituido
      # por alguien con la clave de uno legítimo. Se atestigua el fichero FINAL,
      # el que se descarga: el `release` solo lo renombra si hace falta.
      - name: Atestigua el AppImage (provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/appimage/*.AppImage

      # En la corrida semanal NO se sube nada: son ~115 MB por formato y el
      # objetivo del cron es ejercitar firma y runtime, no distribuir. El log
      # del smoke ya vuelca lo necesario para diagnosticar un fallo.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name != 'schedule'
        with:
          name: appimage
          path: dist/appimage/
          if-no-files-found: error

  flatpak:
    name: Flatpak firmado
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    # El smoke de este job depende de Flathub: 19 s en el dispatch de
    # 43926902589 y 17,0 min en el tag de v1.6.1 (job entero: 21,6 min). Con el
    # tope de 25 min quedaban 3,4 min de margen y una descarga lenta habría
    # matado un tag bueno. 40 min sigue cortando un cuelgue real.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # La clave entra ANTES del build solo aquí: el repo ostree que va
      # dentro del .flatpak se firma al exportarlo y `flatpak install` la
      # exige, así que un bundle sin esa firma no se podría ni instalar en el
      # smoke. La firma detached (.asc) y los SHA256SUMS, que es lo que el
      # usuario verifica, sí se generan después del smoke como en los otros.
      - name: Importa la clave de firma
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::Falta el secreto GPG_SIGNING_KEY (clave privada armored de packaging/gpg/FINGERPRINT)"
            exit 1
          fi
          echo "$GPG_SIGNING_KEY" | gpg --batch --import

      - name: flatpak-builder + runtime 26.08
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Construye el Flatpak (repo ostree firmado, detached pendiente)
        env:
          # flatpak-builder del host: sin sandbox de org.flatpak.Builder no
          # existe el problema de resolver el SDK en la instalación de sistema.
          FLATPAK_BUILDER_CMD: flatpak-builder
        run: packaging/flatpak/build.sh

      # El mismo smoke que AppImage y .exe, pero por el camino del usuario
      # final: `flatpak install` del bundle y `flatpak run`, que es lo único
      # que demuestra que el sandbox sirve HTTP y sale a la red.
      # --exigir-firma-ostree: importa el bundle a un repo temporal y exige
      # «Good signature» de la clave versionada. Sin el flag, un bundle SIN
      # firma ostree interna se instala igual y este smoke pasaría tan contento
      # (`--gpg-file` no sirve de guardia: añade la clave a las confiables).
      - name: Smoke — instala, arranca, lee los fixtures y consulta GitHub
        run: scripts/smoke_package.sh flatpak --exigir-firma-ostree

      - name: Firma el bundle (detached + SHA256SUMS)
        run: packaging/sign.sh dist/flatpak/*.flatpak

      - name: Verifica firmas y checksums
        run: packaging/sign.sh --verificar dist/flatpak/*.flatpak

      - name: Atestigua el Flatpak (provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/flatpak/*.flatpak

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name != 'schedule'
        with:
          name: flatpak
          path: dist/flatpak/
          if-no-files-found: error

  windows:
    name: .exe firmado (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 25
    # gpg y sha256sum NO están en el PATH de PowerShell: existen en Git
    # Bash (Git for Windows /usr/bin). Todo el job corre en bash y el
    # primer paso comprueba los dos binarios antes de gastar minutos.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Comprueba gpg y sha256sum (Git Bash)
        run: |
          command -v gpg || {
            echo "::error::Sin gpg en el runner; usa Git Bash o instala GnuPG (choco install gnupg)"
            exit 1
          }
          gpg --version | head -2
          command -v sha256sum

      - name: Construye el .exe (sin firmar)
        run: SKIP_SIGN=1 packaging/windows/build.sh

      - name: Smoke — arranca, lee los fixtures y consulta GitHub
        run: scripts/smoke_package.sh windows

      - name: Importa la clave de firma
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::Falta el secreto GPG_SIGNING_KEY (clave privada armored de packaging/gpg/FINGERPRINT)"
            exit 1
          fi
          echo "$GPG_SIGNING_KEY" | gpg --batch --import

      - name: Firma el .exe (detached + SHA256SUMS)
        run: packaging/sign.sh dist/windows/*.exe

      - name: Verifica firmas y checksums
        run: packaging/sign.sh --verificar dist/windows/*.exe

      - name: Atestigua el .exe (provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/windows/*.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name != 'schedule'
        with:
          name: windows
          path: dist/windows/
          if-no-files-found: error

  release:
    name: Prepara el borrador con los paquetes
    if: startsWith(github.ref, 'refs/tags/')
    needs: [appimage, flatpak, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Publicar desde una rama sería publicar código que no está en main: el
      # repo no diría de dónde salió el binario. `compare` responde si el commit
      # del tag es ancestro de main (`behind`/`identical`) o no.
      - name: Comprueba que el tag sale de main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          estado="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_REF_NAME" --jq .status)"
          case "$estado" in
            behind | identical) echo "✓ $GITHUB_REF_NAME está en main ($estado)" ;;
            *)
              echo "::error::El tag $GITHUB_REF_NAME no está en main (compare: $estado):" \
                "no se publica lo que no está en main." >&2
              exit 1
              ;;
          esac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      # El manifiesto necesita el repo (versión, huella, commit) y la clave para
      # firmarse. Es el único job de escritura que la importa además de los
      # builds, y con eso el borrador sale con la lista firmada de lo que lleva.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Copia el verificador y la clave pública
        run: |
          cp scripts/verificar_release.sh verificar_release.sh
          cp scripts/comprobar_manifest.py comprobar_manifest.py
          cp packaging/gpg/catflip-release.asc catflip-release.asc

      - name: Importa la clave de firma
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::Falta el secreto GPG_SIGNING_KEY (clave privada armored de packaging/gpg/FINGERPRINT)"
            exit 1
          fi
          echo "$GPG_SIGNING_KEY" | gpg --batch --import

      - name: Manifiesto de la release y su firma
        run: |
          python3 scripts/generar_manifest.py --salida manifest.json \
            artifacts/appimage/*.AppImage \
            artifacts/appimage/*.AppImage.asc \
            artifacts/appimage/SHA256SUMS.appimage \
            artifacts/appimage/SHA256SUMS.appimage.asc \
            artifacts/flatpak/*.flatpak \
            artifacts/flatpak/*.flatpak.asc \
            artifacts/windows/*.exe \
            artifacts/windows/*.exe.asc \
            artifacts/windows/SHA256SUMS.windows \
            artifacts/windows/SHA256SUMS.windows.asc \
            verificar_release.sh comprobar_manifest.py catflip-release.asc
          gpg --batch --yes --armor --detach-sign --output manifest.json.asc manifest.json
          gpg --verify manifest.json.asc manifest.json

      - name: Prepara el borrador (si no existe) y sube los artefactos
        env:
          GH_TOKEN: ${{ github.token }}
          # Sin checkout en este job: GH_REPO evita que gh resuelva el repo
          # con git (fallaría con «not a git repository»).
          GH_REPO: ${{ github.repository }}
        run: |
          # Cada formato trae SHA256SUMS(.asc) con el mismo nombre y los
          # assets de una release son planos: renombrarlos por formato para
          # que gh no falle con 422 "already exists".
          mv artifacts/appimage/SHA256SUMS     artifacts/appimage/SHA256SUMS.appimage
          mv artifacts/appimage/SHA256SUMS.asc artifacts/appimage/SHA256SUMS.appimage.asc
          mv artifacts/flatpak/SHA256SUMS      artifacts/flatpak/SHA256SUMS.flatpak
          mv artifacts/flatpak/SHA256SUMS.asc  artifacts/flatpak/SHA256SUMS.flatpak.asc
          mv artifacts/windows/SHA256SUMS      artifacts/windows/SHA256SUMS.windows
          mv artifacts/windows/SHA256SUMS.asc  artifacts/windows/SHA256SUMS.windows.asc
          # La release nace en BORRADOR: los assets no son visibles hasta que
          # `publicar` los da por buenos. Un asset truncado no llega a quien
          # descarga porque antes lo verifica `verificar-release`.
          # Una sola lista para subir y para comparar: si divergen, la
          # comprobación de idempotencia diría que todo coincide sin haberlo
          # mirado.
          # Solo ficheros y sin duplicados: artifacts/flatpak/ también trae el
          # directorio repo/ (el ostree firmado, que sí queda en el artifact del
          # run) y los assets de una release solo aceptan ficheros con nombre
          # único. `*.flatpak` ya cubre SHA256SUMS.flatpak y `*.flatpak.asc`
          # cubre SHA256SUMS.flatpak.asc: añadirlos aparte duplicaría. En
          # windows NO hay esa casualidad (SHA256SUMS.windows no acaba en
          # .exe), así que sus checksums van aparte en la lista: sin ellos la
          # release sale sin SHA256SUMS.windows(.asc). En appimage los ficheros
          # se listan uno a uno a propósito: con `*` también entraba cualquier
          # carpeta que dejara el smoke y gh moría al intentar subirla (el
          # squashfs-root de 1.5.1).
          FICHEROS=(
            artifacts/appimage/*.AppImage
            artifacts/appimage/*.AppImage.asc
            artifacts/appimage/SHA256SUMS.appimage
            artifacts/appimage/SHA256SUMS.appimage.asc
            artifacts/flatpak/*.flatpak
            artifacts/flatpak/*.flatpak.asc
            artifacts/windows/*.exe
            artifacts/windows/*.exe.asc
            artifacts/windows/SHA256SUMS.windows
            artifacts/windows/SHA256SUMS.windows.asc
            manifest.json
            manifest.json.asc
            verificar_release.sh
            comprobar_manifest.py
            catflip-release.asc
          )
          # Los paquetes son lo que se compara en un rerun. El manifiesto y sus
          # acompañantes no: llevan la fecha de firma y no se reescriben si la
          # release ya está publicada.
          COMPARABLES=(
            artifacts/appimage/*.AppImage
            artifacts/appimage/*.AppImage.asc
            artifacts/appimage/SHA256SUMS.appimage
            artifacts/appimage/SHA256SUMS.appimage.asc
            artifacts/flatpak/*.flatpak
            artifacts/flatpak/*.flatpak.asc
            artifacts/windows/*.exe
            artifacts/windows/*.exe.asc
            artifacts/windows/SHA256SUMS.windows
            artifacts/windows/SHA256SUMS.windows.asc
          )
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]; then
              # Ya publicada: un rerun solo vale si este build produce los
              # MISMOS bytes. Reintentar tras un fallo de red deja de fallar;
              # reescribir lo que alguien ya descargó y verificó, no.
              rm -rf publicado && mkdir publicado
              (cd publicado && gh release download "$GITHUB_REF_NAME" --dir . > /dev/null)
              diferentes=0
              for f in "${COMPARABLES[@]}"; do
                if ! cmp -s "$f" "publicado/$(basename "$f")"; then
                  echo "  ✗ difiere: $(basename "$f")"
                  diferentes=1
                fi
              done
              if [ "$diferentes" = 0 ]; then
                # Mismos paquetes: solo vale si la release ya lleva el
                # manifiesto. Si es anterior, no se le añade nada a una
                # release publicada: se publica una versión nueva.
                for nombre in manifest.json manifest.json.asc verificar_release.sh \
                  comprobar_manifest.py catflip-release.asc; do
                  if [ ! -f "publicado/$nombre" ]; then
                    echo "::error::La release $GITHUB_REF_NAME está publicada, sus paquetes" \
                      "coinciden, pero le falta $nombre. No se añade a una release ya" \
                      "publicada: publica una versión nueva." >&2
                    exit 1
                  fi
                done
                echo "✓ $GITHUB_REF_NAME ya está publicada con exactamente estos assets:" \
                  "no se toca nada"
                exit 0
              fi
              echo "::error::La release $GITHUB_REF_NAME está publicada y este build produce" \
                "assets distintos. No se reescribe: publica una versión nueva." >&2
              exit 1
            fi
            echo "→ el borrador $GITHUB_REF_NAME ya existe: se reemplazan sus assets"
          else
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber "${FICHEROS[@]}"

  # Lo único que nadie comprobaba era la release YA PUBLICADA. Todo lo anterior
  # verifica sobre `dist/`: si un asset se sube truncado, si el renombrado del
  # job `release` se rompe o si un fichero no llega, los tres jobs siguen verdes.
  # Este job baja los assets de la release y repite el chequeo de quien
  # descarga: juego exacto de 12 assets, firmas y checksums con la clave
  # versionada en una jaula vacía (`scripts/verificar_release.sh`) y un smoke
  # real del AppImage descargado. Si falla, la release existe pero queda probado
  # que sus assets están mal: el rojo es la señal.
  verificar-release:
    name: Verifica la release
    # Dos entradas: el borrador recién montado por `release`, o un tag ya
    # publicado que se pasa por input. `always()` hace falta porque en un
    # dispatch `release` no corre, y un `needs` saltado se llevaría por delante
    # este job.
    if: |
      always() && (
        (startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Se verifica el tag, no `main`: de ahí salen los fixtures, el
          # `package.json` y la clave pública con la que se compara.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Trae el verificador del commit actual
        if: inputs.tag != ''
        # Un tag antiguo puede no traer los scripts de verificación: v1.6.0 no
        # tiene `verificar_release.sh`, que se añadió después (probado: el job
        # murió con «No such file or directory»). El verificador que manda es
        # el del commit que corre el workflow; `package.json` y los fixtures
        # siguen siendo los del tag, que es lo que se está verificando.
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- scripts packaging/gpg

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      # El smoke importa `formats` del repo; se instala lo mismo que en el job
      # del AppImage para que el chequeo de formatos no falle por un import.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descarga los assets de la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # `gh release download` sí ve los borradores: el CLI cae a `GET
        # /releases` porque `GET /releases/tags/{tag}` devuelve 404 en ellos.
        run: gh release download "$TAG" --dir release

      # El presupuesto del auditor es absoluto: mientras quepa, el paquete puede
      # engordar sin que nadie lo mire. Esto compara con la release anterior y
      # deja la tabla en el resumen del run.
      - name: Peso frente a la release anterior
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/comparar_tamanos.py

      - name: Firmas, checksums y juego exacto de assets
        env:
          # El script exige que el tag case con `package.json`. En un dispatch
          # el ref es `main`, así que se le da el tag que se está verificando.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          GITHUB_REF="refs/tags/$TAG" GITHUB_REF_NAME="$TAG" \
            scripts/verificar_release.sh release

      # Las firmas prueban autoría; la atestación prueba origen: que esos bytes
      # salieron de este workflow, en este repo, desde ese commit. Sin ella,
      # alguien con la clave privada podría subir otro binario y todo lo demás
      # seguiría verde.
      - name: Atestaciones de build (provenance)
        env:
          GH_TOKEN: ${{ github.token }}
          # En un push de tag `inputs` está vacío: el default es exigir.
          EXIGIR: ${{ inputs.exigir_atestacion }}
        run: |
          if [ "${EXIGIR:-true}" = "false" ]; then
            echo "→ atestación no exigida: releases anteriores a 1.6.2"
            exit 0
          fi
          for f in release/*.AppImage release/*.flatpak release/*.exe; do
            echo "→ $f"
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/packaging.yml"
          done
          echo "✅ los 3 paquetes tienen atestación de este workflow"

      # La firma ostree del Flatpak se comprobaba en el build, no en el fichero
      # que se descarga: aquí se importa el bundle publicado a un repo temporal
      # con una jaula que solo tiene la clave versionada y se exige
      # «Good signature». Solo importa; no necesita runtime ni instalar nada.
      - name: Firma ostree del Flatpak publicado
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak
          scripts/smoke_package.sh flatpak --solo-firma-ostree

      - name: Smoke del AppImage publicado
        # Se arranca el fichero DESCARGADO, no el de `dist/` (que en este job
        # no existe): es la única forma de saber que lo publicado funciona.
        run: |
          mkdir -p dist/appimage
          cp release/*.AppImage dist/appimage/
          scripts/smoke_package.sh appimage

  # El `.exe` era el único formato cuyo asset publicado no se ejecutaba nunca:
  # firmas y checksums sí, pero el binario que descarga un usuario de Windows no
  # se probaba en ningún lado. Corre en Windows porque ahí es donde se prueba de
  # verdad; en el job de build sí se smokea, pero eso es el `dist/` del runner,
  # no lo que quedó en la release.
  verificar-release-windows:
    name: Ejecuta el .exe publicado
    if: |
      always() && (
        (startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    needs: [release]
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descarga el .exe publicado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release download "$TAG" --dir release --pattern "*.exe"

      - name: Smoke del .exe descargado
        env:
          # Igual que en la verificación de Linux: el tag verificado manda, no
          # el ref del dispatch (que sería `main`).
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist/windows
          cp release/*.exe dist/windows/
          GITHUB_REF="refs/tags/$TAG" GITHUB_REF_NAME="$TAG" \
            scripts/smoke_package.sh windows

  # Publicar va aparte y solo después de verificar: si `verificar-release`
  # falla, la release se queda en borrador y nadie ve paquetes rotos. Atado a
  # `refs/tags/`, así que una verificación manual nunca publica nada.
  publicar:
    name: Publica la release verificada
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verificar-release, verificar-release-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # El workflow ya declara `contents: write`; se repite para que el job
    # diga lo que necesita.
    permissions:
      contents: write
    steps:
      - name: Quita el borrador y marca la release como Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  # El cron semanal puede quedar en rojo y nadie entra a mirar Actions un
  # lunes: el fallo se descubría en el tag, que es justo lo que el cron quería
  # evitar. Si la corrida programada falla, este job deja constancia en un
  # issue (lo abre, o comenta/reabre el que ya haya). Y si vuelve a salir bien,
  # `cerrar-aviso` lo cierra: un issue de fallo eternamente abierto tampoco
  # dice si el problema sigue vivo. Ver scripts/avisar_cron.py.
  #
  # Solo `schedule`: un `workflow_dispatch` lo lanza alguien que ya está
  # mirando. Un tag que falla tiene sus propios jobs (`avisar-fallo-tag` y
  # `cerrar-aviso-tag`), porque un tag rojo deja el tag creado y la release sin
  # publicar, y eso tampoco lo mira nadie.
  avisar-fallo:
    name: Avisa del fallo del cron
    if: failure() && github.event_name == 'schedule'
    needs: [appimage, flatpak, windows, auditar-dependencias, avisar-caducidad]
    runs-on: ubuntu-latest
    # Si GitHub no responde, el aviso no debe quedarse colgado 25 minutos.
    timeout-minutes: 5
    # El workflow declara `contents: write` para la release; este job no
    # publica nada, solo necesita escribir issues.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Abre o actualiza el issue del cron
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADOS: >-
            appimage=${{ needs.appimage.result }},
            flatpak=${{ needs.flatpak.result }},
            windows=${{ needs.windows.result }},
            dependencias=${{ needs.auditar-dependencias.result }},
            caducidad=${{ needs.avisar-caducidad.result }}
        run: python3 scripts/avisar_cron.py

  # El reverso: cuando la corrida programada vuelve a salir bien, el issue que
  # abrió el fallo se cierra con el enlace de la corrida que lo arregló.
  # `success()` con `needs` exige que los tres formatos hayan ido bien; si la
  # corrida se cancela, ninguno de los dos jobs toca nada.
  cerrar-aviso:
    name: Cierra el aviso del cron
    if: success() && github.event_name == 'schedule'
    needs: [appimage, flatpak, windows, auditar-dependencias, avisar-caducidad]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cierra el issue si había un fallo abierto
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADOS: >-
            appimage=${{ needs.appimage.result }},
            flatpak=${{ needs.flatpak.result }},
            windows=${{ needs.windows.result }},
            dependencias=${{ needs.auditar-dependencias.result }},
            caducidad=${{ needs.avisar-caducidad.result }}
        run: python3 scripts/avisar_cron.py --ok

  # El cron también vigila dos cosas que no construyen nada:
  # dependencias empaquetadas con vulnerabilidades conocidas y la fecha de
  # caducidad de la clave de firma. Las dos se descubrían el día del tag.
  auditar-dependencias:
    name: Audita dependencias
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: pip-audit sobre lo que se empaqueta
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --progress-spinner off

  avisar-caducidad:
    name: Vigila la caducidad de la clave
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fecha de caducidad de packaging/gpg/FINGERPRINT
        run: python3 scripts/revisar_caducidad_clave.py

  # Un tag en rojo deja el tag creado, la release sin publicar (o en borrador,
  # que no la ve nadie) y, hasta ahora, ni un aviso: lo único que quedaba era
  # un run en Actions. Mismo mecanismo que el cron, con título propio para no
  # mezclar dos fallos distintos. `needs` incluye `release`, `verificar-release`
  # y `publicar`: un fallo al subir assets o al verificar también es un fallo de
  # publicación.
  avisar-fallo-tag:
    name: Avisa del fallo del tag
    if: failure() && startsWith(github.ref, 'refs/tags/')
    needs:
      [appimage, flatpak, windows, release, verificar-release,
       verificar-release-windows, publicar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Abre o actualiza el issue del tag
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADOS: >-
            appimage=${{ needs.appimage.result }},
            flatpak=${{ needs.flatpak.result }},
            windows=${{ needs.windows.result }},
            release=${{ needs.release.result }},
            verificar=${{ needs.verificar-release.result }},
            publicar=${{ needs.publicar.result }}
        run: python3 scripts/avisar_cron.py --tag

  # Y el reverso: si un tag vuelve a salir bien de punta a punta, su issue se
  # cierra. `success()` exige que los seis jobs hayan ido bien, así que un tag
  # que publicó pero falló al verificar no cierra nada.
  cerrar-aviso-tag:
    name: Cierra el aviso del tag
    if: success() && startsWith(github.ref, 'refs/tags/')
    needs:
      [appimage, flatpak, windows, release, verificar-release,
       verificar-release-windows, publicar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cierra el issue del tag si estaba abierto
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADOS: >-
            appimage=${{ needs.appimage.result }},
            flatpak=${{ needs.flatpak.result }},
            windows=${{ needs.windows.result }},
            release=${{ needs.release.result }},
            verificar=${{ needs.verificar-release.result }},
            publicar=${{ needs.publicar.result }}
        run: python3 scripts/avisar_cron.py --ok --tag

  # Desde que la release nace en borrador, un tag que no pasa la verificación
  # deja un borrador invisible que nadie borra a mano. El cron limpia los que
  # llevan más de una semana: un borrador no tiene descargas y sus assets se
  # reconstruyen desde el tag, así que borrarlo no pierde nada del repo.
  limpiar-borradores:
    name: Limpia borradores abandonados
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Borra los borradores de más de 7 días
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/limpiar_borradores.py
