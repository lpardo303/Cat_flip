name: packaging

# Construye y firma los paquetes del core MIT en cada tag v* (y bajo demanda
# con workflow_dispatch). Los artefactos firmados suben como artifacts; en un
# tag además se adjuntan a la release. La clave privada vive SOLO como secreto
# del repo (GPG_SIGNING_KEY, armored) y su huella está versionada en
# packaging/gpg/FINGERPRINT: si no coinciden, el paso de firma falla.
#
# Nota de compatibilidad: el binario se enlaza contra el glibc del runner
# (ubuntu-latest). Bajar el suelo de glibc (p. ej. Ubuntu 22.04) exigiría
# construir en un contenedor antiguo; ver packaging/README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage firmado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Herramientas del build
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils

      - name: Importa la clave de firma
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::Falta el secreto GPG_SIGNING_KEY (clave privada armored de packaging/gpg/FINGERPRINT)"
            exit 1
          fi
          echo "$GPG_SIGNING_KEY" | gpg --batch --import

      - name: Construye y firma el AppImage
        run: packaging/appimage/build.sh

      # El AppImage se construía y firmaba sin ejecutarlo nunca: un bundle
      # roto (sin CAs, sin package.json) salía verde y llegaba al usuario.
      # Mismo smoke que el job de Windows.
      - name: Smoke — el AppImage arranca, sirve / y consulta GitHub
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          # En un tag, la release y los artefactos deben llevar la MISMA
          # versión que package.json (los binarios se nombran con ella).
          if [[ "$GITHUB_REF" == refs/tags/* && "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME ≠ package.json $VERSION"
            exit 1
          fi
          IMG="$(ls dist/appimage/CatFlip-*.AppImage | head -1)"
          echo "→ arrancando $IMG (package.json $VERSION, ref $GITHUB_REF_NAME)"
          # FUSE no siempre está en el runner: se extrae y se lanza AppRun,
          # que además es el squashfs real que se distribuye.
          chmod +x "$IMG"
          (cd dist/appimage && "./$(basename "$IMG")" --appimage-extract > /dev/null)
          (cd dist/appimage/squashfs-root && exec ./AppRun > /tmp/catflip-appimage-smoke.log 2>&1) &
          PID=$!
          # El proceso se mata SIEMPRE al salir del paso, pase lo que pase
          # (mismo criterio que el trap del smoke del Flatpak).
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5050/ && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:5050/; then
            echo "::error::/ no responde en 60 s"
            cat /tmp/catflip-appimage-smoke.log
            exit 1
          fi
          # /version/check es el ÚNICO HTTPS del bundle: si PyInstaller vuelve
          # a empaquetar ssl sin almacén de CAs, checked:false y el aviso de
          # versión muere en silencio (regresión 1.4.0 → 1.4.1). El backoff
          # contra el rate limit vive en scripts/smoke_version_check.sh,
          # compartido por los tres smokes (4 intentos, espera base de 305 s
          # > _RELEASE_TTL_ERR, estirada al reset del rate limit). Exige
          # checked:true y que el current EMPAQUETADO sea el del tag: si no
          # coincide, fallo duro sin reintentar.
          bash scripts/smoke_version_check.sh \
            http://127.0.0.1:5050/version/check \
            /tmp/catflip-appimage-smoke.log "$VERSION"
          echo "✓ AppImage E2E: / y /version/check con current=$VERSION"

      - name: Verifica firmas y checksums
        run: |
          cd dist/appimage
          gpg --verify ./*.AppImage.asc ./*.AppImage
          gpg --verify SHA256SUMS.asc SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/appimage/
          if-no-files-found: error

  flatpak:
    name: Flatpak firmado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Importa la clave de firma
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::Falta el secreto GPG_SIGNING_KEY (clave privada armored de packaging/gpg/FINGERPRINT)"
            exit 1
          fi
          echo "$GPG_SIGNING_KEY" | gpg --batch --import

      - name: flatpak-builder + runtime 26.08
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Construye y firma el Flatpak
        env:
          # flatpak-builder del host: sin sandbox de org.flatpak.Builder no
          # existe el problema de resolver el SDK en la instalación de sistema.
          FLATPAK_BUILDER_CMD: flatpak-builder
        run: packaging/flatpak/build.sh

      - name: Verifica firmas y checksums
        run: |
          cd dist/flatpak
          gpg --verify ./*.flatpak.asc ./*.flatpak
          gpg --verify SHA256SUMS.asc SHA256SUMS
          sha256sum -c SHA256SUMS

      # El Flatpak se construía y firmaba sin instalarse nunca: un bundle
      # roto (sin CAs, sin package.json, sandbox sin red) salía verde y
      # llegaba al usuario. Mismo smoke que AppImage y .exe, pero pasando
      # por el camino del usuario final: instalar el bundle, `flatpak run`
      # y comprobar que el sandbox sirve HTTP y sale a la red. Va DESPUÉS
      # de la verificación de firmas: solo se ejecuta un bundle cuya
      # firma detach y su checksum ya cuadran.
      - name: Smoke — el Flatpak arranca, sirve / y consulta GitHub
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          # En un tag, la release y el bundle deben llevar la MISMA versión
          # que package.json (el bundle se nombra con ella).
          if [[ "$GITHUB_REF" == refs/tags/* && "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME ≠ package.json $VERSION"
            exit 1
          fi
          APP_ID=io.github.lpardo303.CatFlip
          BUNDLE="$(ls "$PWD"/dist/flatpak/CatFlip-*.flatpak | head -1)"
          echo "→ instalando $BUNDLE (package.json $VERSION, ref $GITHUB_REF_NAME)"
          # Limpieza SIEMPRE: la app se mata por app-id (`flatpak run`
          # deja el bwrap colgando si solo se mata al cliente) y el bundle
          # se desinstala — también si el smoke falla o el paso se corta.
          cleanup() {
            kill "$PID" 2>/dev/null || true
            flatpak kill "$APP_ID" 2>/dev/null || true
            for i in 1 2 3 4 5; do
              flatpak ps 2>/dev/null | grep -q "$APP_ID" || break
              sleep 1
            done
            flatpak --user uninstall -y --delete-data "$APP_ID" 2>/dev/null || true
          }
          trap cleanup EXIT
          # --user: la MISMA instalación del resto del job, donde el paso
          # «flatpak-builder + runtime 26.08» ya instaló el runtime (sin
          # --user flatpak buscaría una instalación de sistema y sudo).
          flatpak install --user -y "$BUNDLE"
          flatpak run "$APP_ID" > /tmp/catflip-flatpak-smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5050/ && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:5050/; then
            echo "::error::/ no responde en 60 s — ¿arranca el binario dentro del sandbox o comparte la red?"
            cat /tmp/catflip-flatpak-smoke.log
            exit 1
          fi
          # /version/check es el ÚNICO HTTPS del bundle: dentro del sandbox
          # debe valer lo mismo que en AppImage y .exe (CAs del bundle y
          # red del sandbox). El backoff contra el rate limit vive en
          # scripts/smoke_version_check.sh, compartido por los tres smokes
          # (4 intentos, espera base de 305 s > _RELEASE_TTL_ERR, estirada
          # al reset del rate limit). Exige checked:true y que el current
          # EMPAQUETADO sea el del tag: si no coincide, fallo duro sin
          # reintentar.
          bash scripts/smoke_version_check.sh \
            http://127.0.0.1:5050/version/check \
            /tmp/catflip-flatpak-smoke.log "$VERSION"
          echo "✓ Flatpak E2E: / y /version/check con current=$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/flatpak/
          if-no-files-found: error

  windows:
    name: .exe firmado (Windows)
    runs-on: windows-latest
    # gpg y sha256sum NO están en el PATH de PowerShell: existen en Git
    # Bash (Git for Windows /usr/bin). Todo el job corre en bash y el
    # primer paso comprueba los dos binarios antes de gastar minutos.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Comprueba gpg y sha256sum (Git Bash)
        run: |
          command -v gpg || {
            echo "::error::Sin gpg en el runner; usa Git Bash o instala GnuPG (choco install gnupg)"
            exit 1
          }
          gpg --version | head -2
          command -v sha256sum

      - name: Importa la clave de firma
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::Falta el secreto GPG_SIGNING_KEY (clave privada armored de packaging/gpg/FINGERPRINT)"
            exit 1
          fi
          echo "$GPG_SIGNING_KEY" | gpg --batch --import

      - name: Construye y firma el .exe
        run: packaging/windows/build.sh

      - name: Smoke — el .exe arranca, sirve / y consulta GitHub
        run: |
          EXE="$(ls dist/windows/CatFlip-*.exe | head -1)"
          echo "→ arrancando $EXE"
          "$EXE" > /tmp/catflip-smoke.log 2>&1 &
          PID=$!
          # El proceso se mata SIEMPRE al salir del paso (antes el kill iba
          # tras el reintento y un fallo del check lo dejaba huérfano).
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5050/ && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:5050/; then
            echo "::error::/ no responde en 60 s"
            cat /tmp/catflip-smoke.log
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          curl -s http://127.0.0.1:5050/premium/status
          echo
          # /version/check es el ÚNICO HTTPS del bundle: si PyInstaller vuelve
          # a empaquetar ssl sin almacén de CAs, checked:false y el aviso de
          # versión muere en silencio (regresión de 1.4.0 → 1.4.1). El backoff
          # contra el rate limit vive en scripts/smoke_version_check.sh,
          # compartido por los tres smokes (4 intentos, espera base de 305 s
          # > _RELEASE_TTL_ERR, estirada al reset del rate limit — lo que
          # reventó este job en el PR #46). Este smoke pasa SIN versión
          # esperada: solo exige checked:true (no compara `current`).
          bash scripts/smoke_version_check.sh \
            http://127.0.0.1:5050/version/check \
            /tmp/catflip-smoke.log

      - name: Verifica firmas y checksums
        run: |
          cd dist/windows
          gpg --verify ./*.exe.asc ./*.exe
          gpg --verify SHA256SUMS.asc SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows/
          if-no-files-found: error

  release:
    name: Adjunta los paquetes a la release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [appimage, flatpak, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Crea la release (si no existe) y sube los artefactos
        env:
          GH_TOKEN: ${{ github.token }}
          # Sin checkout en este job: GH_REPO evita que gh resuelva el repo
          # con git (fallaría con «not a git repository»).
          GH_REPO: ${{ github.repository }}
        run: |
          # Cada formato trae SHA256SUMS(.asc) con el mismo nombre y los
          # assets de una release son planos: renombrarlos por formato para
          # que gh no falle con 422 "already exists".
          mv artifacts/appimage/SHA256SUMS     artifacts/appimage/SHA256SUMS.appimage
          mv artifacts/appimage/SHA256SUMS.asc artifacts/appimage/SHA256SUMS.appimage.asc
          mv artifacts/flatpak/SHA256SUMS      artifacts/flatpak/SHA256SUMS.flatpak
          mv artifacts/flatpak/SHA256SUMS.asc  artifacts/flatpak/SHA256SUMS.flatpak.asc
          mv artifacts/windows/SHA256SUMS      artifacts/windows/SHA256SUMS.windows
          mv artifacts/windows/SHA256SUMS.asc  artifacts/windows/SHA256SUMS.windows.asc
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
          # Solo ficheros y sin duplicados: artifacts/flatpak/ también trae el
          # directorio repo/ (el ostree firmado, que sí queda en el artifact del
          # run) y los assets de una release solo aceptan ficheros con nombre
          # único. `*.flatpak` ya cubre SHA256SUMS.flatpak y `*.flatpak.asc`
          # cubre SHA256SUMS.flatpak.asc: añadirlos aparte duplicaría. En
          # windows NO hay esa casualidad (SHA256SUMS.windows no acaba en
          # .exe), así que sus checksums se suben aparte: sin estas dos
          # líneas la release sale sin SHA256SUMS.windows(.asc).
          gh release upload "$GITHUB_REF_NAME" --clobber \
            artifacts/appimage/* \
            artifacts/flatpak/*.flatpak \
            artifacts/flatpak/*.flatpak.asc \
            artifacts/windows/*.exe \
            artifacts/windows/*.exe.asc \
            artifacts/windows/SHA256SUMS.windows \
            artifacts/windows/SHA256SUMS.windows.asc
