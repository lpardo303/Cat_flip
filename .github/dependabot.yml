# Dependabot: version updates para los pins que sí son dependencias.
#
# Dos ecosistemas con destinos distintos:
#   - github-actions: los `uses:` de ci.yml, packaging.yml y
#     tool-versions.yml. (Los binarios fijados con sha256sum — actionlint
#     y shellcheck — NO son actions: de ellos se ocupa el workflow
#     «Avisos de versiones fijadas», que abre un issue.)
#   - pip: requirements.txt (+ requirements-dev y requirements-connectors)
#     en la raíz.
#
# Agrupado por ecosistema: un PR semanal como mucho para cada uno, en vez
# de un PR por dependencia. Todo PR pasa por la CI (actionlint incluido),
# así que un update roto se ve antes de mergear.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      python:
        patterns: ["*"]
    # Bloqueos para que la ronda semanal no reabra cada lunes el mismo PR
    # roto (verificado en local en e44aa03). Se quitan cuando la causa
    # desaparezca: el cap de dateutil en google-cloud-bigquery o la
    # detección de charset-normalizer.
    ignore:
      # 3.x (y superiores): google-cloud-bigquery 3.46.2 exige dateutil
      # <3 y pip acaba en ResolutionImpossible — los jobs pg-smoke y
      # s3-smoke no pueden siquiera instalar requirements-connectors.txt.
      - dependency-name: "python-dateutil"
        versions: [">=3.0.0"]
      # 3.5.2 detecta el CSV de prueba cp1252 como «mac_latin2» en vez de
      # la familia windows-125x (3.4.4 daba windows-1250 → cp1252), lo
      # que decodifica mal el español y rompe tests/test_encoding.py.
      # Se deja pasar 3.6+ por si ahí está la corrección.
      - dependency-name: "charset-normalizer"
        versions: [">=3.5.0,<3.6.0"]
    commit-message:
      prefix: "deps"
